[pytest]
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:starlette.*
markers =
    unix_only: requires Unix-only modules (skipped on Windows).
    mlflow: requires a live MLflow backend (skipped by default).
    requires_local_registry: depends on data/domain_kit_registry.json or other machine-local kit state (skipped by default).
    preexisting_defect: known pre-existing test/code mismatch (xfail).
    manual_script: not a pytest test; run the script manually.
addopts = -m "not requires_local_registry and not mlflow and not manual_script"
