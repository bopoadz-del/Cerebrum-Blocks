version: "3.8"

services:
  knowledge:
    build:
      context: ../..
      dockerfile: blocks/knowledge/Dockerfile
    container_name: cerebrum-knowledge
    ports:
      - "8009:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - VECTOR_DB_URL=http://host.docker.internal:8001
      - CEREBRUM_MASTER_KEY=${CEREBRUM_MASTER_KEY:-test-key}
    networks:
      - cerebrum-net
    restart: unless-stopped

networks:
  cerebrum-net:
    external: true
