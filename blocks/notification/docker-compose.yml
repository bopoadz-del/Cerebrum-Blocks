version: "3.8"

services:
  notification:
    build:
      context: ../..
      dockerfile: blocks/notification/Dockerfile
    container_name: cerebrum-notification
    ports:
      - "8008:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-cerebrum@localhost}
      - CEREBRUM_MASTER_KEY=${CEREBRUM_MASTER_KEY:-test-key}
    networks:
      - cerebrum-net
    restart: unless-stopped

networks:
  cerebrum-net:
    external: true
