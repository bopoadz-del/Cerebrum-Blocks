version: "3.8"

services:
  agent-swarm:
    build:
      context: ../..
      dockerfile: blocks/agent_swarm/Dockerfile
    container_name: cerebrum-agent-swarm
    ports:
      - "8006:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - VECTOR_DB_URL=http://host.docker.internal:8001
      - MAX_CONCURRENT_AGENTS=3
      - DEFAULT_TIMEOUT=120
      - CEREBRUM_MASTER_KEY=${CEREBRUM_MASTER_KEY:-test-key}
    networks:
      - cerebrum-net
    restart: unless-stopped

networks:
  cerebrum-net:
    external: true
