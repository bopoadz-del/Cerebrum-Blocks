<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerebrum Capture — Web Client</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #fff;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .drop-zone {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #6366f1;
            background: rgba(99,102,241,0.05);
        }
        .drop-zone input { display: none; }
        .drop-zone .icon { font-size: 48px; margin-bottom: 12px; }
        .drop-zone p { color: #aaa; font-size: 14px; }
        .preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .field {
            margin-bottom: 12px;
        }
        .field label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field input {
            width: 100%;
            padding: 10px 12px;
            background: #0f0f1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
        }
        .field input:focus {
            outline: none;
            border-color: #6366f1;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #5558e0; }
        button:disabled { background: #333; cursor: not-allowed; }
        .result {
            margin-top: 20px;
            padding: 16px;
            background: #0f0f1a;
            border-radius: 8px;
            display: none;
        }
        .result h3 { font-size: 14px; color: #888; margin-bottom: 8px; }
        .result pre {
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #ccc;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(99,102,241,0.2);
            color: #818cf8;
            border-radius: 4px;
            font-size: 12px;
            margin: 2px;
        }
        .error {
            color: #ef4444;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Cerebrum Capture</h1>
        <p class="subtitle">Upload an image — OCR + AI structuring + vector store</p>

        <img id="preview" class="preview" alt="Preview">

        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept="image/*">
            <div class="icon">📁</div>
            <p>Click or drop image here</p>
        </div>

        <div class="field">
            <label>API Base URL</label>
            <input type="text" id="apiUrl" value="http://localhost:8000">
        </div>

        <div class="field">
            <label>API Key</label>
            <input type="password" id="apiKey" value="test-key" placeholder="Bearer token">
        </div>

        <button id="uploadBtn" disabled>Upload &amp; Capture</button>
        <div class="error" id="error"></div>

        <div class="result" id="result">
            <h3>Result</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const uploadBtn = document.getElementById('uploadBtn');
        const errorEl = document.getElementById('error');
        const resultEl = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files[0]) handleFile(fileInput.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                errorEl.textContent = 'Please select an image file.';
                return;
            }
            selectedFile = file;
            errorEl.textContent = '';
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Processing...';
            errorEl.textContent = '';
            resultEl.style.display = 'none';

            const apiUrl = document.getElementById('apiUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('source', 'web');

            try {
                const resp = await fetch(`${apiUrl}/capture/upload`, {
                    method: 'POST',
                    headers: apiKey ? { 'Authorization': `Bearer ${apiKey}` } : {},
                    body: formData
                });
                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.detail || 'Upload failed');
                }
                showResult(data);
            } catch (err) {
                errorEl.textContent = err.message;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload & Capture';
            }
        });

        function showResult(data) {
            let html = '';
            html += `<p><strong>Capture ID:</strong> <code>${data.capture_id}</code></p>`;
            html += `<p><strong>Summary:</strong> ${data.summary || 'N/A'}</p>`;
            if (data.tags && data.tags.length) {
                html += '<p><strong>Tags:</strong> ' + data.tags.map(t => `<span class="tag">${t}</span>`).join('') + '</p>';
            }
            if (data.entities && data.entities.length) {
                html += '<p><strong>Entities:</strong></p><ul>';
                data.entities.forEach(e => {
                    html += `<li>${e.type}: <code>${e.value}</code></li>`;
                });
                html += '</ul>';
            }
            html += `<p><strong>OCR Confidence:</strong> ${(data.ocr_confidence * 100).toFixed(1)}%</p>`;
            html += `<details><summary>Raw Text</summary><pre>${data.raw_text || 'N/A'}</pre></details>`;
            resultContent.innerHTML = html;
            resultEl.style.display = 'block';
        }
    </script>
</body>
</html>
