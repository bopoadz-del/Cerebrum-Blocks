version: "3.8"

services:
  capture:
    build:
      context: ../..
      dockerfile: blocks/capture/Dockerfile
    container_name: cerebrum-capture
    ports:
      - "8005:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - VECTOR_DB_URL=http://host.docker.internal:8001
      - OCR_LANGUAGES=ara+eng
      - STORE_CAPTURES=true
      - CEREBRUM_MASTER_KEY=${CEREBRUM_MASTER_KEY:-test-key}
    volumes:
      - capture-data:/app/data/captures
    networks:
      - cerebrum-net
    restart: unless-stopped

volumes:
  capture-data:

networks:
  cerebrum-net:
    external: true
