name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV: test
      DATABASE_URL: postgresql://cerebrum:cerebrum@localhost:5433/cerebrum
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      VECTOR_DIMENSION: "384"
      CEREBRUM_VIRGIN: "false"
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: cerebrum
          POSTGRES_PASSWORD: cerebrum
          POSTGRES_DB: cerebrum
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for OCR/PDF/MIME blocks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr poppler-utils libgl1 libglib2.0-0 libmagic1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stub audit (implement-or-register gate)
        run: python scripts/audit_stubs.py

      - name: Kit composition audit (declare-or-register gate)
        run: python scripts/audit_kit_composition.py

      - name: Secret scan (non-test paths)
        run: python scripts/scan_secrets.py

      - name: Apply database migrations
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$DATABASE_URL" -f migrations/001_historical_benchmark.sql
          psql "$DATABASE_URL" -f migrations/002_vector_ingestion.sql

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v

      - name: Run typed-block tests
        run: pytest -q tests/test_typed_block.py

      - name: Run kit intake tests (stage K1)
        # The source gate: no source, no encode. Exercised against real .xlsx
        # and .docx, not just structured fixtures.
        run: pytest -q tests/test_intake_kit.py

      - name: Run kit scaffold tests (stage K3)
        # K1 -> K3 -> K2: the scaffold writes the domain overlay to the exact
        # path formula_definitions reads, so a formula that survived the
        # source gate becomes a grounded definition without a further step.
        run: pytest -q tests/test_scaffold_kit.py

      - name: Run kit publisher tests
        # Publishing decides whether a kit the store advertises can be
        # installed. CI names test files explicitly rather than running
        # tests/, so a new file runs only once it is listed here.
        run: pytest -q tests/test_publish_kit.py

      - name: Run core RAG + vector + registry tests
        run: pytest -q tests/core/test_vector_store.py tests/core/test_registry_integrity.py tests/core/test_block_contracts.py tests/core/test_rag_ingestion.py

      - name: Run kit bundle completeness fence
        # CI names test files explicitly rather than running tests/, so a new
        # test file is not executed until it is listed here. This fence went
        # green on its own PR without ever running; that is the failure mode
        # it exists to prevent, one level up.
        run: pytest -q tests/test_kit_bundle_completeness.py

      - name: Run formula grounding + executor tests
        # test_formula_executor_v2.py was among the 103 test files this repo
        # never ran: CI names files explicitly rather than running tests/.
        run: pytest -q tests/test_formula_grounding.py tests/test_formula_executor_v2.py

      - name: Run all-blocks tests
        run: pytest -q tests/test_all_blocks.py

      - name: Run FinanceOps foundation tests
        run: pytest -q tests/finance_ops/

      - name: Run regression security tests
        run: |
          pytest -q tests/test_regression_security.py \
                    tests/core/test_sentry_scrubbing.py \
                    tests/core/test_rate_limit_key_storage.py \
                    tests/core/test_tier_block_access.py \
                    tests/core/test_api_key_rejection.py \
                    tests/core/test_file_crypto.py \
                    tests/core/test_file_crypto_imports_resolve.py \
                    tests/core/test_backup_scheduler.py \
                    tests/core/test_no_telegram.py \
                    tests/core/test_ingestion_no_arbitrary_write.py \
                    tests/core/test_block_resolution_choke_point.py \
                    tests/core/test_ssrf_guard_wired.py \
                    tests/core/test_secrets_master_key_required.py \
                    tests/core/test_signing_operational.py \
                    tests/core/test_two_tenant_isolation.py \
                    tests/core/test_deploy_parity.py \
                    tests/core/test_virgin_shelf.py \
                    tests/core/test_trust_scope_enforcement.py \
                    tests/routers/test_health_capability.py

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build
