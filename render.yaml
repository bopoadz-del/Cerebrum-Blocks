# Cerebrum Blocks — Render Blueprint
# 4 services: Platform API, Platform UI, Store API, Store UI

services:
  # ── Platform API (Python + FastAPI) ──────────────────────────────────────
  - type: web
    name: cerebrum-platform-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8000
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CEREBRUM_MASTER_KEY
        sync: false
    healthCheckPath: /health

  # ── Platform UI (React + Vite) ───────────────────────────────────────────
  - type: web
    name: cerebrum-platform
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://cerebrum-platform-api.onrender.com

  # ── Store API (Python + FastAPI) ─────────────────────────────────────────
  - type: web
    name: cerebrum-store-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8000
    healthCheckPath: /health

  # ── Store UI (React + Vite) ──────────────────────────────────────────────
  - type: web
    name: cerebrum-store
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
