    unit: m
    question: >-
      What is the ols penetration height in m for this airport? The answer must
      arrive with surface_name, aerodrome_reference_code, reference_point,
      datum_m_or_ft, amsl_basis — without those it cannot be acted on and will be
      refused. Leave unanswered rather than estimating: an unanswered figure
      refuses, an estimate ships.
    requires: [surface_name, aerodrome_reference_code, reference_point, datum_m_or_ft, amsl_basis]
    answered_by: null
    answered_at: null
    source: null
  pcn:
