invariants:

- id: INV-APC-AUTH-OLS
  kind: authority
  applies_to: {quantity: [ols_penetration_height, ils_critical_area, declared_distance]}
  hook: H1
  governing_class: icao_annex_14
  fallback_class: national_aviation_reg
  demote: [aerodrome_manual, design_drawings, method_statement]
  severity: refuse
  evidence: {sheet: "§5.1, §9.1"}
  message: "OLS/declared-distance figure governed by ICAO Annex 14 — a lesser source is not acceptable proof"

- id: INV-APC-OLS-QUALIFIERS
  kind: qualifier
  applies_to: {quantity: ols_penetration_height}
  requires: [surface_name, aerodrome_reference_code, reference_point, datum_m_or_ft, amsl_basis]
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.3"}
  message: "OLS figure missing {missing}"

- id: INV-APC-DECLARED-DISTANCE
  kind: qualifier
  applies_to: {quantity: declared_distance}
  requires: [runway_designator, direction, effective_date, temporary]
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.3"}
  message: "declared distance missing {missing}"

- id: INV-APC-SAFETY-AREA
  kind: qualifier
  applies_to: {quantity: [rsa_limit, rofa_limit, tsa_limit, tofa_limit]}
  requires: [runway_category, aerodrome_reference_code]
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.3"}
  message: "safety area missing {missing}"

- id: INV-APC-PCN
  kind: qualifier
  applies_to: {quantity: [pcn, acr]}
  requires: [pavement_type, subgrade_category, tyre_pressure_category, evaluation_method]
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.3"}
  message: "PCN/ACR missing {missing}"

- id: INV-APC-UNITS-DATUM
  kind: unit_discipline
  applies_to: {quantity: any}
  requires_one_of: [m, ft]
  forbid: [mixed, unspecified]
  severity: refuse
  hook: H2
  evidence: {sheet: "§10"}
  message: "units ambiguous — aviation works in feet, construction in metres"

- id: INV-APC-WGS84
  kind: unit_discipline
  applies_to: {quantity: any, spec_extension: true, claim_class: position}
  requires: [wgs84_confirmed]
  severity: refuse
  hook: H2
  evidence: {sheet: "§10"}
  message: "position without WGS-84 confirmation"

- id: INV-APC-MAGNETIC
  kind: unit_discipline
  applies_to: {quantity: any, spec_extension: true, claim_class: bearing}
  requires: [magnetic_or_true]
  severity: refuse
  hook: H2
  evidence: {sheet: "§10"}
  message: "bearing without magnetic/true basis — runway designator is magnetic"

- id: INV-APC-PROVENANCE
  kind: provenance
  applies_to: {quantity: any}
  forbid: [carry_from_similar_runway, interpolate_ols_without_code, interpolate_declared_distance_without_qualifier, use_unverifiable_currency]
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.4.1"}
  message: "forbidden derivation: {value}"

- id: INV-APC-CURRENCY
  kind: currency
  applies_to: {quantity: declared_distance}
  window: {provider: airac_cycle, max_age: next_cycle}
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.5"}
  message: "declared distance stale on {value}"

# ---------------------------------------------------------------------------
# Correction 6: engine-required completions of the DECLARED staleness
# triggers. ols_geometry, ils_critical_area, rsa_limit, pcn, agl_unserviceable
# and phasing_plan are named in staleness_triggers but no currency invariant
# above governs them (INV-APC-CURRENCY governs declared_distance only) — a
# declared trigger nothing checks is a rule that reports green while gating
# nothing, and the loader refuses it. These records add only the provider
# wiring — no new rule, no new event, no new state provider.
# ---------------------------------------------------------------------------

- id: INV-APC-CURRENCY-OLS-GEOMETRY
  kind: currency
  applies_to: {quantity: ols_geometry}
  window: {provider: phasing_plan_current, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "OLS geometry is stale once an obstacle change or a safeguarding revision has happened"

- id: INV-APC-CURRENCY-ILS
  kind: currency
  applies_to: {quantity: ils_critical_area}
  window: {provider: NAVAID_status, max_age: realtime}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "ILS critical area is stale once a NAVAID change or siting revision has happened"

- id: INV-APC-CURRENCY-RSA
  kind: currency
  applies_to: {quantity: rsa_limit}
  window: {provider: airac_cycle, max_age: next_cycle}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "the runway safety area limit is stale once the runway category has changed"

- id: INV-APC-CURRENCY-PCN
  kind: currency
  applies_to: {quantity: pcn}
  window: {provider: phasing_plan_current, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "PCN is stale once its pavement evaluation interval has elapsed"

- id: INV-APC-CURRENCY-AGL
  kind: currency
  applies_to: {quantity: agl_unserviceable}
  window: {provider: agl_status, max_age: shift}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "AGL serviceability is stale once a light change or the service interval has passed"

- id: INV-APC-CURRENCY-PHASING
  kind: currency
  applies_to: {quantity: phasing_plan}
  window: {provider: phasing_plan_current, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "the phasing plan is stale once it has been revised"
