kit: aesthetic
version: 1
hooks_used: [H0, H1, H2, H3]

quantities:
  neuromodulator_dose:    {units: [units]}
  filler_volume:          {units: [mL]}
  hyaluronidase_dose:     {units: [IU]}
  device_fluence:         {units: [J_cm2]}
  device_pulse_duration:  {units: [ms]}
  device_cooling_temp:    {units: [degC]}
  peel_contact_time:      {units: [min]}
  anaesthetic_max_dose:   {units: [mg]}

  # Correction 5: staleness_triggers below keys contraindication_list. It is
  # not a figure the model states a value for -- it is an artifact (a
  # maintained list) that a staleness event invalidates. A staleness trigger
  # keyed on something the manifest never declares as a quantity is a load
  # failure, so it is declared here, unitless, purely so the trigger has
  # something to be keyed on. (INV-AES-CURRENCY below applies to `any`
  # quantity, so this is already governed once declared -- no new currency
  # invariant needed.)
  contraindication_list:  {units: [—]}

qualifier_fields:
  product_brand:          {type: string}
  product_class:          {type: enum,   values: [HA, CaHA, PLLA, botulinum, other]}
  reversible:             {type: bool}
  reconstitution_used:    {type: string}
  device:                 {type: string}
  skin_type_fitzpatrick:  {type: enum,   values: [I, II, III, IV, V, VI]}
  treatment_area:         {type: string}
  pass_number:            {type: number}
  indication:             {type: enum,   values: [elective, occlusion]}
  protocol_version:       {type: string}
  protocol_approved_date: {type: date}

source_classes:
  regulator:              {rank: 1}
  SPC:                    {rank: 2, reject_as_proof: [other_brand_spc]}
  manufacturer_ifu:       {rank: 3}
  published_guideline:    {rank: 4}
  professional_body:      {rank: 5}
  clinic_protocol:        {rank: 6, reject_as_proof: [unversioned, no_approval_date]}
  training_material:      {rank: 7}
  practitioner_preference: {rank: 8}

  # Correction 1: SPC rejects other_brand_spc; clinic_protocol rejects
  # unversioned and no_approval_date. Each rejected class must itself be
  # declared, or the rule could never fire. Ranked below every governing
  # class above.
  other_brand_spc:        {rank: 9}
  unversioned:            {rank: 9}
  no_approval_date:       {rank: 9}

state_providers:
  protocol_current:       {kind: revision, max_age: event}
  device_serviced:        {kind: revision, max_age: event}
  hyaluronidase_stock:    {kind: status,   max_age: shift}
  hyaluronidase_temp:     {kind: status,   max_age: shift}

staleness_triggers:
  neuromodulator_dose:    [product_brand_change, reconstitution_change]
  filler_volume:          [product_line_change]
  device_fluence:         [servicing, software_update, lamp_change]
  peel_contact_time:      [product_change, pH_change]
  hyaluronidase_dose:     [protocol_revision, stock_change]
  contraindication_list:  [guideline_update]

scope_refusals:
  - pattern: "how much should I inject"
    authority: "treating practitioner — clinical decision"
  - pattern: "is this patient suitable"
    authority: "consultation and assessment"
  - pattern: "is this (swelling|redness|bruising|nodule) normal"
    authority: "clinical review — follow adverse event protocol"
  - pattern: "can I treat despite this contraindication"
    authority: "medical director"
  - pattern: "what's causing this complication"
    authority: "clinical assessment — adverse event protocol"

spec_extensions:
  claim_class:            true
  same_source:            true

# The questions this kit needs answered, and nothing else. Every value is
# null and stays null until someone answers: the owner during the build, or
# the operator later through /v1/reasoning/pending. An unanswered figure is
# NOT a stub -- the platform refuses anything needing it and names the
# question, so there is no plausible number to mistake for a real one. An
# answer is recorded with answered_by, answered_at and source, because an
# unattributed figure is not evidence whoever supplied it.
#
# `requires` is derived from this kit's own qualifier invariants, so an answer
# that satisfies the question cannot then be refused for incompleteness.
figures:
  anaesthetic_max_dose:
    value: null
    unit: mg
    question: >-
      What is the anaesthetic max dose in mg for this platform? Leave unanswered
      rather than estimating: an unanswered figure refuses, an estimate ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
  device_cooling_temp:
    value: null
    unit: degC
    question: >-
      What is the device cooling temp in degC for this platform? The answer must
      arrive with device, skin_type_fitzpatrick, treatment_area, pass_number —
      without those it cannot be acted on and will be refused. Leave unanswered
      rather than estimating: an unanswered figure refuses, an estimate ships.
    requires: [device, skin_type_fitzpatrick, treatment_area, pass_number]
    answered_by: null
    answered_at: null
    source: null
  device_fluence:
    value: null
    unit: J_cm2
    question: >-
      What is the device fluence in J_cm2 for this platform? The answer must arrive
      with device, skin_type_fitzpatrick, treatment_area, pass_number — without
      those it cannot be acted on and will be refused. Leave unanswered rather than
      estimating: an unanswered figure refuses, an estimate ships.
    requires: [device, skin_type_fitzpatrick, treatment_area, pass_number]
    answered_by: null
    answered_at: null
    source: null
  device_pulse_duration:
    value: null
    unit: ms
    question: >-
      What is the device pulse duration in ms for this platform? The answer must
      arrive with device, skin_type_fitzpatrick, treatment_area, pass_number —
      without those it cannot be acted on and will be refused. Leave unanswered
      rather than estimating: an unanswered figure refuses, an estimate ships.
    requires: [device, skin_type_fitzpatrick, treatment_area, pass_number]
    answered_by: null
    answered_at: null
    source: null
  filler_volume:
    value: null
    unit: mL
    question: >-
      What is the filler volume in mL for this platform? The answer must arrive
      with product_brand, treatment_area — without those it cannot be acted on and
      will be refused. Leave unanswered rather than estimating: an unanswered
      figure refuses, an estimate ships.
    requires: [product_brand, treatment_area]
    answered_by: null
    answered_at: null
    source: null
  hyaluronidase_dose:
    value: null
    unit: IU
    question: >-
      What is the hyaluronidase dose in IU for this platform? The answer must
      arrive with product_brand, treatment_area, indication, protocol_version —
      without those it cannot be acted on and will be refused. Leave unanswered
      rather than estimating: an unanswered figure refuses, an estimate ships.
    requires: [product_brand, treatment_area, indication, protocol_version]
    answered_by: null
    answered_at: null
    source: null
  neuromodulator_dose:
    value: null
    unit: units
    question: >-
      What is the neuromodulator dose in units for this platform? The answer must
      arrive with product_brand, treatment_area — without those it cannot be acted
      on and will be refused. Leave unanswered rather than estimating: an
      unanswered figure refuses, an estimate ships.
    requires: [product_brand, treatment_area]
    answered_by: null
    answered_at: null
    source: null
  peel_contact_time:
    value: null
    unit: min
    question: >-
      What is the peel contact time in min for this platform? Leave unanswered
      rather than estimating: an unanswered figure refuses, an estimate ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
