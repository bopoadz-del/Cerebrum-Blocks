kit: ports_marine
version: 1
hooks_used: [H0, H1, H2, H3]

quantities:
  quay_wall_load:         {units: [kN_m2]}
  deck_load:              {units: [kN_m2]}
  declared_depth:         {units: [m]}
  bollard_swl:            {units: [t]}
  fender_reaction:        {units: [kN]}
  fender_energy:          {units: [kNm]}
  crane_rail_load:        {units: [kN_m]}
  wheel_load:             {units: [kN]}
  stack_height:           {units: [tiers]}
  wind_limit:             {units: [ms]}

  # Correction 6 (spec §1): a staleness_triggers KEY must be a declared
  # quantity. fender_capacity and stack_height_limit are artifacts the
  # sheet's triggers name, not figures — declared unitless so the trigger
  # has something to be keyed on.
  fender_capacity:        {units: [—]}
  stack_height_limit:     {units: [—]}

qualifier_fields:
  terminal_id:            {type: string}
  berth_id:               {type: string}
  asset_id:               {type: string}
  depth_datum:            {type: enum,   values: [chart_datum, berth_datum, LAT, MHWS]}
  survey_date:            {type: date}
  tide_state_assumed:     {type: string}
  certification_ref:      {type: string}
  stack_area:             {type: string}
  wind_state:             {type: string}

source_classes:
  flag_statutory:         {rank: 1}
  classification_society: {rank: 2}
  design_dossier:         {rank: 3, reject_as_proof: [verbal_engineering, undated_calculation]}
  as_built_drawings:      {rank: 4}
  operating_manual:       {rank: 5, reject_as_proof: [unversioned]}
  berth_procedure:        {rank: 6}
  harbour_master:         {rank: 7}
  shift_instruction:      {rank: 8}
  # Correction 1: every class named in reject_as_proof or demote must itself
  # be a declared source class, or the rule that names it can never fire and
  # the loader refuses. Ranked below every governing class.
  verbal_engineering:     {rank: 9}
  undated_calculation:    {rank: 10}
  unversioned:            {rank: 11}

state_providers:
  survey_current:         {kind: revision, max_age: event}
  berth_maintenance:      {kind: status,   max_age: shift}
  fender_bollard_condition: {kind: status, max_age: shift}
  weather_tide:           {kind: status,   max_age: realtime}

staleness_triggers:
  declared_depth:         [dredging, silting, survey_superseded]
  quay_wall_load:         [modification, inspection_finding]
  bollard_swl:            [certification_interval]
  fender_capacity:        [certification_interval, incident]
  stack_height_limit:     [operating_manual_revision]
  crane_rail_load:        [crane_change, quay_modification]

scope_refusals:
  - pattern: "is it safe to berth this vessel"
    authority: "harbour master / marine operations"
  - pattern: "can this crane lift this load"
    authority: "lifting engineer + design dossier"
  - pattern: "is this berth available"
    authority: "berth scheduling + harbour master"
  - pattern: "is the depth adequate today"
    authority: "harbour master — current survey and tide"
  - pattern: "can we stack higher"
    authority: "terminal operations + operating manual"

spec_extensions:
  claim_class:            true
  same_source:            true




# The questions this kit needs answered, and nothing else. Every value is
# null and stays null until someone answers: the owner during the build, or
# the operator later through /v1/reasoning/pending. An unanswered figure is
# NOT a stub -- the platform refuses anything needing it and names the
# question, so there is no plausible number to mistake for a real one. An
# answer is recorded with answered_by, answered_at and source, because an
# unattributed figure is not evidence whoever supplied it.
#
# `requires` is derived from this kit's own qualifier invariants, so an answer
# that satisfies the question cannot then be refused for incompleteness.
figures:
  bollard_swl:
    value: null
    unit: t
    question: >-
      What is the bollard swl in t for this platform? The answer must arrive with
      asset_id, certification_ref — without those it cannot be acted on and will be
      refused. Leave unanswered rather than estimating: an unanswered figure
      refuses, an estimate ships.
    requires: [asset_id, certification_ref]
    answered_by: null
    answered_at: null
    source: null
  crane_rail_load:
    value: null
    unit: kN_m
    question: >-
      What is the crane rail load in kN_m for this platform? The answer must arrive
      with asset_id, certification_ref — without those it cannot be acted on and
      will be refused. Leave unanswered rather than estimating: an unanswered
      figure refuses, an estimate ships.
    requires: [asset_id, certification_ref]
    answered_by: null
    answered_at: null
    source: null
  deck_load:
    value: null
    unit: kN_m2
    question: >-
      What is the deck load in kN_m2 for this platform? Leave unanswered rather
      than estimating: an unanswered figure refuses, an estimate ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
  declared_depth:
    value: null
    unit: m
    question: >-
      What is the declared depth in m for this platform? The answer must arrive
      with depth_datum, survey_date, tide_state_assumed — without those it cannot
      be acted on and will be refused. Leave unanswered rather than estimating: an
      unanswered figure refuses, an estimate ships.
    requires: [depth_datum, survey_date, tide_state_assumed]
    answered_by: null
    answered_at: null
    source: null
  fender_energy:
    value: null
    unit: kNm
    question: >-
      What is the fender energy in kNm for this platform? The answer must arrive
      with asset_id, certification_ref — without those it cannot be acted on and
      will be refused. Leave unanswered rather than estimating: an unanswered
      figure refuses, an estimate ships.
    requires: [asset_id, certification_ref]
    answered_by: null
    answered_at: null
    source: null
  fender_reaction:
    value: null
    unit: kN
    question: >-
      What is the fender reaction in kN for this platform? The answer must arrive
      with asset_id, certification_ref — without those it cannot be acted on and
      will be refused. Leave unanswered rather than estimating: an unanswered
      figure refuses, an estimate ships.
    requires: [asset_id, certification_ref]
    answered_by: null
    answered_at: null
    source: null
  quay_wall_load:
    value: null
    unit: kN_m2
    question: >-
      What is the quay wall load in kN_m2 for this platform? Leave unanswered
      rather than estimating: an unanswered figure refuses, an estimate ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
  stack_height:
    value: null
    unit: tiers
    question: >-
      What is the stack height in tiers for this platform? The answer must arrive
      with stack_area, wind_state — without those it cannot be acted on and will be
      refused. Leave unanswered rather than estimating: an unanswered figure
      refuses, an estimate ships.
    requires: [stack_area, wind_state]
    answered_by: null
    answered_at: null
    source: null
  wheel_load:
    value: null
    unit: kN
    question: >-
      What is the wheel load in kN for this platform? Leave unanswered rather than
      estimating: an unanswered figure refuses, an estimate ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
  wind_limit:
    value: null
    unit: ms
    question: >-
      What is the wind limit in ms for this platform? The answer must arrive with
      stack_area, wind_state — without those it cannot be acted on and will be
      refused. Leave unanswered rather than estimating: an unanswered figure
