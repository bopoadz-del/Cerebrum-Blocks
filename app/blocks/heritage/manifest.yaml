kit: heritage
version: 1
hooks_used: [H0, H1, H3]

quantities:
  mortar_mix:             {units: [ratio, pct]}
  compressive_strength:   {units: [MPa, Nmm2]}
  vapour_permeability:    {units: [g_m2_day]}
  substrate_strength:     {units: [MPa]}
  structural_capacity:    {units: [kN, kNm]}
  cleaning_parameter:     {units: [—]}
  retention_ratio:        {units: [pct]}

  # Spec §1: a staleness trigger is keyed on a QUANTITY. These are the
  # artifacts the sheet's triggers name — records the domain talks about,
  # unitless, so the trigger has something to be keyed on.
  consent:               {units: [—]}
  condition_survey:      {units: [—]}
  materials_analysis:    {units: [—]}
  monitoring:            {units: [—]}
  method_statement:      {units: [—]}

qualifier_fields:
  evidence_basis:         {type: enum,   values: [documented, inferred, assumed]}
  substrate_ref:          {type: string}
  consent_ref:            {type: string}
  element_or_phase:       {type: string}
  building_id:            {type: string}
  analysis_date:          {type: date}
  reversibility:          {type: enum,   values: [reversible, irreversible, uncertain]}

source_classes:
  legislation:            {rank: 1}
  listed_building_consent: {rank: 2}
  statutory_body_guidance: {rank: 3}
  conservation_officer_written: {rank: 4}
  standards:              {rank: 5}
  conservation_management_plan: {rank: 6}
  materials_analysis:     {rank: 7}
  specification:          {rank: 8}
  professional_body_guidance: {rank: 9, reject_as_proof: [generic_guide, another_building_example]}
  manufacturer_data:      {rank: 10}
  generic_guide:          {rank: 11}
  another_building_example: {rank: 11}

state_providers:
  consent_status:         {kind: revision, max_age: event}
  survey_date:            {kind: revision, max_age: event}
  analysis_date:          {kind: revision, max_age: event}
  discovery_since_spec:   {kind: status,   max_age: event}

staleness_triggers:
  consent:                [lapse_period, departure_from_approved_details]
  condition_survey:       [further_weathering, storm_damage, opening_up]
  materials_analysis:     [different_element, different_phase]
  monitoring:             [any_intervention]
  method_statement:       [variation]

scope_refusals:
  - pattern: "do we need consent"
    authority: "conservation officer — written pre-application advisable"
  - pattern: "what mortar should I use"
    authority: "requires mortar analysis for this fabric"
  - pattern: "can we remove this"
    authority: "conservation architect + consent"
  - pattern: "is this original"
    authority: "stratigraphic + archival investigation"
  - pattern: "is this beam adequate"
    authority: "conservation accredited engineer"
  - pattern: "what did this look like originally"
    authority: "archival evidence — comparators are not evidence for this building"

spec_extensions:
  claim_class:            true
  same_source:            true

# The questions this kit needs answered, and nothing else. Every value is
# null and stays null until someone answers: the owner during the build, or
# the operator later through /v1/reasoning/pending. An unanswered figure is
# NOT a stub -- the platform refuses anything needing it and names the
# question, so there is no plausible number to mistake for a real one. An
# answer is recorded with answered_by, answered_at and source, because an
# unattributed figure is not evidence whoever supplied it.
#
# `requires` is derived from this kit's own qualifier invariants, so an answer
# that satisfies the question cannot then be refused for incompleteness.
figures:
  cleaning_parameter:
    value: null
    unit: —
    question: >-
      What is the cleaning parameter in — for this platform? The answer must arrive
      with evidence_basis, consent_ref — without those it cannot be acted on and
      will be refused. Leave unanswered rather than estimating: an unanswered
      figure refuses, an estimate ships.
    requires: [evidence_basis, consent_ref]
    answered_by: null
    answered_at: null
    source: null
  compressive_strength:
    value: null
    unit: MPa
    question: >-
      What is the compressive strength in MPa or Nmm2 for this platform? The answer
      must arrive with evidence_basis, consent_ref, substrate_ref — without those
      it cannot be acted on and will be refused. Leave unanswered rather than
      estimating: an unanswered figure refuses, an estimate ships.
    requires: [evidence_basis, consent_ref, substrate_ref]
    answered_by: null
    answered_at: null
    source: null
  mortar_mix:
    value: null
    unit: ratio
    question: >-
      What is the mortar mix in ratio or pct for this platform? The answer must
      arrive with evidence_basis, consent_ref, substrate_ref — without those it
      cannot be acted on and will be refused. Leave unanswered rather than
      estimating: an unanswered figure refuses, an estimate ships.
    requires: [evidence_basis, consent_ref, substrate_ref]
    answered_by: null
    answered_at: null
    source: null
  retention_ratio:
    value: null
    unit: pct
    question: >-
      What is the retention ratio in pct for this platform? The answer must arrive
      with evidence_basis, consent_ref — without those it cannot be acted on and
      will be refused. Leave unanswered rather than estimating: an unanswered
      figure refuses, an estimate ships.
    requires: [evidence_basis, consent_ref]
    answered_by: null
    answered_at: null
    source: null
  structural_capacity:
    value: null
    unit: kN
    question: >-
      What is the structural capacity in kN or kNm for this platform? The answer
      must arrive with evidence_basis, consent_ref — without those it cannot be
      acted on and will be refused. Leave unanswered rather than estimating: an
      unanswered figure refuses, an estimate ships.
    requires: [evidence_basis, consent_ref]
    answered_by: null
    answered_at: null
    source: null
  substrate_strength:
    value: null
    unit: MPa
    question: >-
      What is the substrate strength in MPa for this platform? The answer must
      arrive with evidence_basis, consent_ref — without those it cannot be acted on
      and will be refused. Leave unanswered rather than estimating: an unanswered
      figure refuses, an estimate ships.
    requires: [evidence_basis, consent_ref]
    answered_by: null
    answered_at: null
    source: null
  vapour_permeability:
    value: null
    unit: g_m2_day
    question: >-
      What is the vapour permeability in g_m2_day for this platform? The answer
      must arrive with evidence_basis, consent_ref — without those it cannot be
      acted on and will be refused. Leave unanswered rather than estimating: an
      unanswered figure refuses, an estimate ships.
    requires: [evidence_basis, consent_ref]
    answered_by: null
    answered_at: null
    source: null
