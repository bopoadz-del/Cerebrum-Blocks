invariants:

- id: INV-PS-AUTH-CURVE
  kind: authority
  applies_to: {quantity: [npsh_required, por_flow_min, por_flow_max, surge_pressure]}
  hook: H1
  governing_class: manufacturer_datasheet
  fallback_class: design_basis_report
  demote: [operating_procedure, maintenance_record, shift_instruction]
  severity: refuse
  evidence: {sheet: "§9.1"}
  message: "a curve or surge figure is governed by the datasheet for THIS trim — a generic model curve is not proof"

- id: INV-PS-NPSH-MARGIN
  kind: qualifier
  applies_to: {quantity: npsh_required}
  requires: [npsh_margin, npsh_margin_basis]
  severity: refuse
  hook: H3
  evidence: {sheet: "rule, §4.1"}
  message: "NPSHr is a 3% head-drop value, not a safe limit — required margin must travel with it"

- id: INV-PS-NPSHA-CASE
  kind: qualifier
  applies_to: {quantity: npsh_available}
  requires: [npsh_case]
  severity: refuse
  hook: H3
  evidence: {sheet: "§4.2"}
  message: "NPSHa without design/worst-case basis — worst case is the one that matters"

- id: INV-PS-PROTECTION-LIVE
  kind: derivation
  applies_to: {quantity: vibration_trip}
  requires_state: [protection_status]
  block_if_missing_state: true
  severity: refuse
  hook: H3
  evidence: {sheet: "§6.2, §6.3"}
  message: "protection setpoint answer without stating whether the protection is currently in service"

- id: INV-PS-POR-AOR
  kind: qualifier
  applies_to: {quantity: [por_flow_min, por_flow_max, aor_flow_min, aor_flow_max]}
  requires: [por_or_aor_named, authorisation_if_aor]
  severity: refuse
  hook: H3
  evidence: {sheet: "§4.3"}
  message: "operating region without POR/AOR named and what authorises AOR"

- id: INV-PS-BAND-FLOW
  kind: band
  applies_to: {quantity: [por_flow_min, por_flow_max]}
  band: {min: present, max: present, same_source: true}
  severity: refuse
  hook: H2
  evidence: {sheet: "§4"}
  message: "flow window is a band — return both sides"

- id: INV-PS-PROVENANCE
  kind: provenance
  applies_to: {quantity: any}
  forbid: [extrapolate_beyond_published_curve, carry_curve_across_trims, carry_surge_study_across_stations, convert_head_pressure_without_density, interpolate_across_trim_boundaries]
  severity: refuse
  hook: H3
  evidence: {sheet: "§9.4.1"}
  message: "forbidden derivation: {value}"

- id: INV-PS-CURRENCY
  kind: currency
  applies_to: {quantity: [surge_pressure, pump_curve]}
  window: {provider: pump_curve_current, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "§9.5"}
  message: "curve or surge study stale on {value}"

# ---------------------------------------------------------------------------
# Engine-required plumbing for the declared staleness_triggers. pump_curve is
# already governed by INV-PS-CURRENCY above; surge_study, npsha,
# protection_setpoints, efficiency and wet_well_volume are not, and the
# loader refuses a trigger that no currency invariant governs. These records
# add only the provider wiring -- no new rule, no new event.
# ---------------------------------------------------------------------------

- id: INV-PS-CURRENCY-SURGE
  kind: currency
  applies_to: {quantity: surge_study}
  window: {provider: surge_study_current, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "the surge study is stale once the pump, valve closure time, main or air vessel configuration has changed"
  measurement: "Probe the surge study x20 after a valve_closure_change event. Before: the superseded study was quoted. After: 20 refusals."

- id: INV-PS-CURRENCY-NPSHA
  kind: currency
  applies_to: {quantity: npsha}
  window: {provider: process_conditions, max_age: shift}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "NPSHa is stale once seasonal temperature, level regime or screen fouling has changed the process conditions it was computed from"
  measurement: "Probe NPSHa x20 after a level_regime event. Before: the prior figure was quoted. After: 20 refusals."

- id: INV-PS-CURRENCY-PROTECTION
  kind: currency
  applies_to: {quantity: protection_setpoints}
  window: {provider: scada_state, max_age: realtime}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "protection setpoints are stale once SCADA has changed"
  measurement: "Probe protection setpoints x20 after a scada_change event. Before: the old setpoints were quoted. After: 20 refusals."

- id: INV-PS-CURRENCY-EFFICIENCY
  kind: currency
  applies_to: {quantity: efficiency}
  window: {provider: efficiency_test_current, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "efficiency is stale once wear has accrued since the last test"
  measurement: "Probe efficiency x20 after a wear_since_test event. Before: the last-tested figure was quoted. After: 20 refusals."

- id: INV-PS-CURRENCY-WETWELL
  kind: currency
  applies_to: {quantity: wet_well_volume}
  window: {provider: wet_well_survey_current, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "wet well volume is stale once siltation has occurred since the last survey"
  measurement: "Probe wet well volume x20 after a siltation event. Before: the last-surveyed figure was quoted. After: 20 refusals."
