invariants:

- id: INV-ARC-AUTH-CODE
  kind: authority
  applies_to: {quantity: any, spec_extension: true, claim_class: code_requirement}
  hook: H1
  governing_class: building_code
  fallback_class: planning_consent
  demote: [design_guide, previous_project, consultant_email]
  severity: refuse
  evidence: {sheet: "§7.1"}
  message: "code requirement governed by the code — a guide or previous project is not the code"

- id: INV-ARC-AREA-BASIS
  kind: qualifier
  applies_to: {quantity: floor_area}
  requires: [area_basis]
  severity: refuse
  hook: H3
  evidence: {sheet: "§4.1, §7.3.1"}
  message: "floor area missing {missing} — same building, several correct answers 20-30% apart"

- id: INV-ARC-PLOT-RATIO
  kind: qualifier
  applies_to: {quantity: [plot_ratio, site_coverage]}
  requires: [area_basis, code_edition]
  severity: refuse
  hook: H3
  evidence: {sheet: "§4.2"}
  message: "plot ratio missing {missing} — inclusions and exclusions vary by jurisdiction"

- id: INV-ARC-TRAVEL-DISTANCE
  kind: qualifier
  applies_to: {quantity: travel_distance}
  requires: [occupancy_class, sprinklered, code_edition]
  severity: refuse
  hook: H3
  evidence: {sheet: "§7.3"}
  message: "travel distance missing {missing}"

- id: INV-ARC-FIRE-RATING
  kind: qualifier
  applies_to: {quantity: fire_rating}
  requires: [compartment_line, code_edition]
  severity: refuse
  hook: H3
  evidence: {sheet: "§7.3"}
  message: "fire rating missing {missing}"

- id: INV-ARC-LEVEL
  kind: qualifier
  applies_to: {quantity: level}
  requires: [level_basis, datum]
  severity: refuse
  hook: H3
  evidence: {sheet: "§7.3"}
  message: "level missing {missing} — FFL and SSL differ by the floor build-up"

- id: INV-ARC-DISCIPLINE
  kind: provenance
  applies_to: {quantity: any}
  forbid: [structural_from_architectural_set, MEP_from_architectural_set, levels_from_architectural_section, scale_from_drawing, carry_from_similar_project]
  severity: refuse
  hook: H3
  evidence: {sheet: "§7.4.1, §11.3"}
  message: "forbidden derivation: {value}"

- id: INV-ARC-CURRENCY
  kind: currency
  applies_to: {quantity: any}
  window: {provider: drawing_revision, max_age: next_issue}
  severity: refuse
  hook: H3
  evidence: {sheet: "§7.5"}
  message: "figure from an unverified or superseded revision"
