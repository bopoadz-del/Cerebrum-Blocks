kit: architecture
version: 1
hooks_used: [H0, H1, H2, H3]

quantities:
  floor_area:             {units: [m2],  aliases: [GEA, GIA, NIA, GFA, BUA]}
  plot_ratio:             {units: [ratio]}
  site_coverage:          {units: [pct]}
  travel_distance:        {units: [m]}
  fire_rating:            {units: [min]}
  level:                  {units: [m]}
  u_value:                {units: [W_m2K]}
  fee_percentage:         {units: [pct]}
  charge_out_rate:        {units: [currency_per_hour]}
  stage_duration:         {units: [weeks]}

qualifier_fields:
  area_basis:             {type: enum,   values: [GEA, GIA, NIA, IPMS1, IPMS2, IPMS3, local_GFA, BUA, saleable]}
  level_basis:            {type: enum,   values: [FFL, SSL]}
  datum:                  {type: string}
  occupancy_class:        {type: string}
  sprinklered:            {type: bool}
  code_edition:           {type: string}
  compartment_line:       {type: string}
  discipline_owner:       {type: enum,   values: [architecture, structure, MEP, survey, fire_engineer]}
  quality_band:           {type: enum,   values: [basic, standard, premium, super_prime]}
  revision_status:        {type: enum,   values: [for_construction, for_information, draft, superseded]}

source_classes:
  building_code:          {rank: 1}
  planning_consent:       {rank: 2}
  contract_documents:     {rank: 3}
  specification:          {rank: 4}
  structural_drawings:    {rank: 5}
  MEP_drawings:           {rank: 6}
  architectural_drawings: {rank: 7, reject_as_proof: [for_information, superseded_revision, sketch, markup]}
  consultant_reports:     {rank: 8}
  contractor_shop_drawings: {rank: 9}
  # Correction 1: every class named in reject_as_proof or demote must itself
  # be a declared source class, or the rule that names it can never fire and
  # the loader refuses. Ranked below every governing class.
  for_information:        {rank: 10}
  superseded_revision:    {rank: 11}
  sketch:                 {rank: 12}
  markup:                 {rank: 13}
  design_guide:           {rank: 14}
  previous_project:       {rank: 15}
  consultant_email:       {rank: 16}

state_providers:
  drawing_revision:       {kind: revision, max_age: next_issue}
  survey_date:            {kind: revision, max_age: event}
  code_edition_current:   {kind: revision, max_age: event}
  fire_strategy_current:  {kind: revision, max_age: event}

staleness_triggers:
  floor_area:             [any_revision]
  plot_ratio:             [consent_variation, zoning_change]
  travel_distance:        [layout_change, occupancy_change, sprinkler_change]
  fire_rating:            [code_edition_change, compartment_line_change]
  level:                  [design_revision, build_up_change]
  u_value:                [product_change, standard_update]
  fee_percentage:         [market_movement, project_type_change]

scope_refusals:
  - pattern: "does this design comply"
    authority: "Building Control / approving authority"
  - pattern: "can I remove this (wall|column|beam)"
    authority: "structural engineer"
  - pattern: "is this fire strategy acceptable"
    authority: "fire engineer / civil defence"
  - pattern: "will planning approve this"
    authority: "planning authority"

spec_extensions:
  claim_class:            true
  same_source:            true

# The questions this kit needs answered, and nothing else. Every value is
# null and stays null until someone answers: the owner during the build, or
# the operator later through /v1/reasoning/pending. An unanswered figure is
# NOT a stub -- the platform refuses anything needing it and names the
# question, so there is no plausible number to mistake for a real one. An
# answer is recorded with answered_by, answered_at and source, because an
# unattributed figure is not evidence whoever supplied it.
#
# `requires` is derived from this kit's own qualifier invariants, so an answer
# that satisfies the question cannot then be refused for incompleteness.
figures:
  charge_out_rate:
    value: null
    unit: currency_per_hour
    question: >-
      What is the charge out rate in currency_per_hour for this platform? Leave
      unanswered rather than estimating: an unanswered figure refuses, an estimate
      ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
  fee_percentage:
    value: null
    unit: pct
    question: >-
      What is the fee percentage in pct for this platform? Leave unanswered rather
      than estimating: an unanswered figure refuses, an estimate ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
  fire_rating:
    value: null
    unit: min
    question: >-
      What is the fire rating in min for this platform? The answer must arrive with
      compartment_line, code_edition — without those it cannot be acted on and will
      be refused. Leave unanswered rather than estimating: an unanswered figure
      refuses, an estimate ships.
    requires: [compartment_line, code_edition]
    answered_by: null
    answered_at: null
    source: null
  floor_area:
    value: null
    unit: m2
    question: >-
      What is the floor area in m2 for this platform? The answer must arrive with
      area_basis — without those it cannot be acted on and will be refused. Leave
      unanswered rather than estimating: an unanswered figure refuses, an estimate
      ships.
    requires: [area_basis]
    answered_by: null
    answered_at: null
    source: null
  level:
    value: null
    unit: m
    question: >-
      What is the level in m for this platform? The answer must arrive with
      level_basis, datum — without those it cannot be acted on and will be refused.
      Leave unanswered rather than estimating: an unanswered figure refuses, an
      estimate ships.
    requires: [level_basis, datum]
    answered_by: null
    answered_at: null
    source: null
  plot_ratio:
    value: null
    unit: ratio
    question: >-
      What is the plot ratio in ratio for this platform? The answer must arrive
      with area_basis, code_edition — without those it cannot be acted on and will
      be refused. Leave unanswered rather than estimating: an unanswered figure
      refuses, an estimate ships.
    requires: [area_basis, code_edition]
    answered_by: null
    answered_at: null
    source: null
  site_coverage:
    value: null
    unit: pct
    question: >-
      What is the site coverage in pct for this platform? The answer must arrive
      with area_basis, code_edition — without those it cannot be acted on and will
      be refused. Leave unanswered rather than estimating: an unanswered figure
      refuses, an estimate ships.
    requires: [area_basis, code_edition]
    answered_by: null
    answered_at: null
    source: null
  stage_duration:
    value: null
    unit: weeks
    question: >-
      What is the stage duration in weeks for this platform? Leave unanswered
      rather than estimating: an unanswered figure refuses, an estimate ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
  travel_distance:
    value: null
    unit: m
    question: >-
      What is the travel distance in m for this platform? The answer must arrive
      with occupancy_class, sprinklered, code_edition — without those it cannot be
      acted on and will be refused. Leave unanswered rather than estimating: an
      unanswered figure refuses, an estimate ships.
    requires: [occupancy_class, sprinklered, code_edition]
    answered_by: null
    answered_at: null
    source: null
  u_value:
    value: null
    unit: W_m2K
    question: >-
      What is the u value in W_m2K for this platform? Leave unanswered rather than
      estimating: an unanswered figure refuses, an estimate ships.
    requires: []
    answered_by: null
    answered_at: null
    source: null
